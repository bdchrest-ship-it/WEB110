<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's your Army</title>
</head>
<body>
    <form>
        <main>
            <label for="lname">First Name</label>
            <input type=text id="fname" name="fname" placeholder="John" required>
        </main>
        <main>
            <label for="lname">Last Name</label>
            <input type=text id="lname" name="lname" placeholder="Warhammer" required>
        </main>
            
        <main>
            <label for="army">An Army?</label>
            <input type="text" id="army" name="army" placeholder="What Army?" required>
        </main>

        <main>
            <label for="quantity">Total Points</label>
            <input type="number" id="quantity" name="quantity" min="0" max="40000" placeholder="--">
        </main>

        <main>
            <label for="phone">Phone #</label>
            <input type="tel" id="phone" placeholder="(123)-456-7890">
        </main>

        <br>
        <main>
            <label for="reach_out">Want me to reach out?</label>
            <input type="checkbox" id="reach_out" name="reach_out">
        </main>
        <main>
            <input type="reset">
        </main>

        <main>
            <input type="submit">
        </main>


    </form>
</body>
</html>
